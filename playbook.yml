---
- name: Common setup on all machines
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

- name: nginx on the machines that serve HTTP
  # Not on dbservers — db runs no web server (an older version of this
  # playbook installed it on all hosts; the db play below removes it).
  hosts: webservers:loadbalancers
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Ensure nginx is running and enabled at boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true


- name: Configure the shared PostgreSQL database
  hosts: dbservers
  become: true
  tasks:
    - name: Install PostgreSQL, psycopg2 (driver for the Ansible modules), acl
      # acl = setfacl, which Ansible needs to make its temp files readable
      # when becoming the unprivileged "postgres" user below.
      ansible.builtin.apt:
        name: [postgresql, python3-psycopg2, acl]
        state: present

    - name: Remove nginx (older all-hosts play installed it; db serves no HTTP)
      ansible.builtin.apt:
        name: nginx
        state: absent

    - name: Listen on all interfaces (Debian defaults to localhost-only)
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ pg_version }}/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: restart postgresql

    - name: Allow the app role in from the webs and from WSL
      # File-level edit on purpose: postgresql_pg_hba validates against a
      # live server, but the rules must be in place before postgres accepts
      # any remote login at all. One rule per call (users/databases are
      # strings, not lists — a list gets written to the file literally),
      # hence the loop. 10.0.2.2 is how WSL appears to the guest through
      # VirtualBox's NAT port forward (the 5433 → 5432 one).
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/{{ pg_version }}/main/pg_hba.conf
        contype: host
        users: "{{ tiket_db.user }}"
        databases: "{{ tiket_db.name }}"
        address: "{{ item }}"
        method: scram-sha-256
      loop:
        - 192.168.56.0/24   # the webs, over the host-only network
        - 10.0.2.2/32       # WSL, arriving via the NAT forward
      notify: restart postgresql

    - name: Create the app role
      # Local socket as the postgres OS user (peer auth) — no password needed
      # for admin work on the db host itself.
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ tiket_db.user }}"
        password: "{{ tiket_db.password }}"

    - name: Create the app database owned by the role
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ tiket_db.name }}"
        owner: "{{ tiket_db.user }}"

  handlers:
    - name: restart postgresql
      ansible.builtin.service:
        name: postgresql
        state: restarted


- name: Configure web servers (containerized Flask app + shared PostgreSQL + nginx proxy)
  hosts: webservers
  become: true
  tasks:
    - name: Fail fast when the registry is not configured
      ansible.builtin.assert:
        that: registry_host | length > 0
        fail_msg: >-
          set registry_host in group_vars/all/vars.yml — the tunnel hostname
          after `./registry/up.sh` (see README "Containerized app + registry")

    - name: Install docker and the Python SDK for the Ansible docker modules
      # python3-docker = Docker SDK for Python, which community.docker's
      # login/container modules talk through.
      ansible.builtin.apt:
        name: [docker.io, python3-docker, dnsutils]
        state: present

    - name: Whitelist the plain-HTTP registry for the docker daemon
      # Only needed in offline/NAT mode, where the registry has no TLS front.
      # Pulls through the Cloudflare tunnel are real TLS: the whitelist (and
      # this file) must then be empty/absent.
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: "{{ {'insecure-registries': registry_insecure_addresses} | to_nice_json }}"
      when: registry_insecure_addresses | length > 0
      notify: restart docker

    - name: Drop the daemon whitelist when pulling over TLS
      ansible.builtin.file:
        path: /etc/docker/daemon.json
        state: absent
      when: registry_insecure_addresses | length == 0
      notify: restart docker

    - name: Ensure docker is running and enabled at boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Apply the daemon config now, not at end of play
      # The registry login/pull below needs the whitelist already active —
      # a handler restart would only fire after them.
      ansible.builtin.meta: flush_handlers

    - name: Stop the old bare-metal app service (pre-container deployments)
      # Teardown for VMs provisioned by the earlier gunicorn/systemd play.
      # The unit is already gone on freshly built machines, which systemd
      # reports as failure — tolerated here by design.
      ansible.builtin.systemd:
        name: tiket-app
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the old bare-metal app files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/tiket-app.service
        - /opt/tiket
      notify: daemon-reload

    - name: Log in to the image registry
      # Auth lives at /root/.docker/config.json; the pull below uses it.
      community.docker.docker_login:
        registry: "{{ registry_host }}"
        username: "{{ registry_user }}"
        password: "{{ vault_registry_password }}"

    - name: Run the app container
      # Publishes on 127.0.0.1:8000 — exactly where the local nginx site
      # (web-site.conf.j2) already proxies, so the nginx config is untouched.
      # DNS: docker's embedded resolver forwards to the host's resolv.conf
      # (lb's dnsmasq), so db.tiket.lab resolves inside the container.
      community.docker.docker_container:
        name: tiket-app
        # Container hostname = VM name, so the app's "Hello from web1/web2"
        # (socket.gethostname) and the visits.host rows stay meaningful —
        # by default docker would show the container ID.
        hostname: "{{ inventory_hostname }}"
        image: "{{ registry_host }}/tiket-app:{{ app_version }}"
        restart_policy: unless-stopped
        ports:
          - "127.0.0.1:8000:8000"
        env:
          DB_HOST: db.{{ lab_domain }}
          DB_NAME: "{{ tiket_db.name }}"
          DB_USER: "{{ tiket_db.user }}"
          DB_PASSWORD: "{{ tiket_db.password }}"

    - name: Deploy nginx site proxying to the app
      ansible.builtin.template:
        src: templates/web-site.conf.j2
        dest: /etc/nginx/sites-available/tiket
        mode: "0644"
      notify: restart nginx

    - name: Enable tiket site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/tiket
        dest: /etc/nginx/sites-enabled/tiket
        state: link
      notify: restart nginx

    - name: Remove default site (it would shadow our config on port 80)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: Stop dhclient from rewriting resolv.conf on lease renewal
      # dhclient rewrites /etc/resolv.conf at every renewal with whatever
      # resolver NAT hands out, silently dropping the lab nameservers —
      # and then the app 500s, since it resolves db.tiket.lab on every
      # request. This hook no-ops the resolv.conf writer; the copy below
      # stays authoritative no matter what DHCP says. The container's
      # embedded DNS also forwards here, so this keeps working.
      ansible.builtin.copy:
        dest: /etc/dhcp/dhclient-enter-hooks.d/tiket-dns
        mode: "0644"
        content: |
          #!/bin/sh
          # Lab DNS is static; never let dhclient-script touch resolv.conf.
          make_resolv_conf() { :; }

    - name: Resolve via lb's dnsmasq first, NAT resolver as fallback
      # Fallback matters: if lb is down or reloading, apt etc. still resolve.
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ hostvars['lb']['private_ip'] }}
          nameserver 10.0.2.3

  handlers:
    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

- name: Configure DNS (dnsmasq) and load balancer
  hosts: loadbalancers
  become: true
  tasks:
    - name: Install dnsmasq (and dig for verification)
      ansible.builtin.apt:
        name: [dnsmasq, dnsutils]
        state: present

    - name: Deploy dnsmasq config for the lab domain
      ansible.builtin.template:
        src: templates/dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/tiket.conf
        mode: "0644"
      notify: restart dnsmasq

    - name: Stop dhclient from rewriting resolv.conf on lease renewal
      # Same reason as the webs: resolv.conf must stay at 127.0.0.1 or
      # this host loses its own dnsmasq (and apt falls back to NAT).
      ansible.builtin.copy:
        dest: /etc/dhcp/dhclient-enter-hooks.d/tiket-dns
        mode: "0644"
        content: |
          #!/bin/sh
          # Lab DNS is static; never let dhclient-script touch resolv.conf.
          make_resolv_conf() { :; }

    - name: Point lb's own resolver at dnsmasq
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 127.0.0.1

    - name: Deploy load balancer config (backends by DNS name)
      ansible.builtin.template:
        src: templates/loadbalancer.conf.j2
        dest: /etc/nginx/conf.d/loadbalancer.conf
        mode: "0644"
      notify: restart nginx

    - name: Remove default site (it would shadow our config on port 80)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

  # Handler order matters: dnsmasq must be up before nginx restarts,
  # because nginx resolves the upstream names at (re)start time.
  handlers:
    - name: restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted

    - name: restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
